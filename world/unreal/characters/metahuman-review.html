<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><!-- TITLE --></title>
    <style>
      :root {
        color-scheme: dark;
        font:
          16px/1.5 system-ui,
          sans-serif;
        background: #15191d;
        color: #eef2f4;
      }
      body {
        max-width: 1500px;
        margin: auto;
        padding: 24px;
      }
      a {
        color: #9adbd3;
      }
      p {
        max-width: 85ch;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }
      figure {
        margin: 0;
        background: #22292e;
        border-radius: 12px;
        overflow: hidden;
      }
      img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
        display: block;
      }
      figcaption {
        padding: 16px;
      }
      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <nav><a href="/studio">Scenario Creator</a></nav>
    <h1><!-- TITLE --></h1>
    <p>Created directly in MetaHuman from an Epic preset and explicit appearance settings.</p>
    <p><!-- ASSESSMENT --></p>
    <p>Click any image for the full-resolution capture. MetaHuman views are rendered in Unreal Engine.</p>
    <main class="grid"><!-- IMAGES --></main>
  </body>
</html>
