<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Sierra valley asset review</title>
    <style>
      html, body { margin: 0; height: 100%; background: #d0d1cf; color: #253c32; font: 15px system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      aside { position: fixed; top: 16px; left: 16px; width: 330px; max-height: calc(100% - 32px); overflow: auto;
        background: rgba(238, 234, 225, 0.94); border-radius: 10px; padding: 16px 18px; box-shadow: 0 4px 18px rgba(0,0,0,.15); }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p, dl { margin: 8px 0; line-height: 1.45; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
      dt { color: #687060; }
      dd { margin: 0; }
      .views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0; }
      button { font: inherit; padding: 7px 8px; border: 1px solid #b9b5a8; border-radius: 6px; background: #fff; color: #253c32; cursor: pointer; }
      button:hover { background: #f4f1ea; }
      img { width: 100%; border-radius: 6px; display: block; margin: 6px 0 2px; cursor: zoom-in; }
      small { color: #687060; }
      #status { position: fixed; bottom: 16px; right: 16px; background: rgba(238,234,225,.94); padding: 8px 12px; border-radius: 6px; }
    </style>
    <script type="importmap">
      { "imports": { "three": "./three/build/three.module.js", "three/addons/": "./three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside>
      <h1 id="title"></h1>
      <p id="summary"></p>
      <dl id="facts"></dl>
      <div class="views">
        <button data-view="reference">Reference camera</button>
        <button data-view="eye">Eye level</button>
        <button data-view="nadir">Drone 30 m nadir</button>
        <button data-view="oblique">Drone 60 m oblique</button>
      </div>
      <small>Drag to orbit, scroll to zoom, right-drag to pan.</small>
      <a id="renderLink" target="_blank"><img id="render" alt="Studio render" /></a>
      <small>Blender Cycles studio render through the fitted reference camera</small>
      <a id="compareLink" target="_blank"><img id="compare" alt="Reference comparison" /></a>
      <small>Approved reference, render and outline overlay</small>
    </aside>
    <div id="status">Loading…</div>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const asset = await (await fetch('./asset.json')).json();
      document.title = `${asset.title} · Sierra valley asset review`;
      document.querySelector('#title').textContent = asset.title;
      document.querySelector('#summary').textContent = asset.summary;
      const facts = document.querySelector('#facts');
      for (const [label, value] of asset.facts) facts.insertAdjacentHTML('beforeend', `<dt>${label}</dt><dd>${value}</dd>`);
      for (const id of ['render', 'compare']) {
        document.querySelector(`#${id}`).src = asset[id];
        document.querySelector(`#${id}Link`).href = asset[id];
      }

      const canvas = document.querySelector('#view');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 0.9;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd0d1cf);
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.6;
      scene.fog = new THREE.Fog(0xd0d1cf, 45, 160);
      const sun = new THREE.DirectionalLight(0xffffff, 2.0);
      sun.position.set(-7, 16, 9);
      sun.castShadow = true;
      sun.shadow.mapSize.set(4096, 4096);
      sun.shadow.camera.left = sun.shadow.camera.bottom = -12;
      sun.shadow.camera.right = sun.shadow.camera.top = 12;
      sun.shadow.bias = -0.0004;
      sun.shadow.normalBias = 0.02;
      sun.shadow.radius = 4;
      scene.add(sun);
      const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 96), new THREE.MeshStandardMaterial({ color: 0xd0d1cf, roughness: 1 }));
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI / 2 - 0.02;
      // Blender (x, y, z) with +Z up maps to glTF/three (x, z, -y).
      const toThree = ([x, y, z]) => new THREE.Vector3(x, z, -y);
      const target = new THREE.Vector3(0, asset.extents[2] * 0.42, 0);
      const views = {
        reference: () => {
          const position = toThree(asset.camera.positionM);
          const forward = toThree(asset.camera.forward);
          camera.fov = asset.camera.verticalFovDegrees;
          return [position, position.clone().add(forward.multiplyScalar(position.distanceTo(target)))];
        },
        eye: () => [new THREE.Vector3(7.5, 1.7, 9.5), new THREE.Vector3(0, 2.2, 0)],
        nadir: () => [new THREE.Vector3(0, 30, 0.01), new THREE.Vector3(0, 0, 0)],
        oblique: () => [new THREE.Vector3(34, 60, 30), new THREE.Vector3(0, 0, 0)],
      };
      function show(name) {
        camera.fov = 40;
        const [position, look] = views[name]();
        camera.position.copy(position);
        controls.target.copy(look);
        camera.updateProjectionMatrix();
        controls.update();
      }
      for (const button of document.querySelectorAll('[data-view]')) button.addEventListener('click', () => show(button.dataset.view));

      const draco = new DRACOLoader().setDecoderPath('./three/examples/jsm/libs/draco/gltf/');
      const status = document.querySelector('#status');
      new GLTFLoader().setDRACOLoader(draco).load(
        asset.model,
        (gltf) => {
          gltf.scene.traverse((node) => {
            if (node.isMesh) {
              node.castShadow = node.receiveShadow = true;
              if (node.material.map) node.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
            }
          });
          scene.add(gltf.scene);
          status.textContent = `${asset.triangles.toLocaleString()} triangles`;
        },
        (event) => (status.textContent = event.total ? `Loading ${Math.round((100 * event.loaded) / event.total)}%` : 'Loading…'),
        (error) => (status.textContent = `Model failed to load: ${error.message}`),
      );

      function resize() {
        renderer.setSize(innerWidth, innerHeight, false);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      }
      addEventListener('resize', resize);
      resize();
      show('reference');
      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
