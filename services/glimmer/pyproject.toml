[tool.fal.apps.snr-glimmer]
auth = "private"
machine_type = "GPU-H200"
exposed_port = 8000
min_concurrency = 0
max_concurrency = 1
max_multiplexing = 4
concurrency_buffer = 0
keep_alive = 60
startup_timeout = 1800
request_timeout = 600
skip_retry_conditions = ["timeout", "server_error", "connection_error"]
secrets = ["HF_TOKEN"]

[tool.fal.apps.snr-glimmer.image]
image = "vllm/vllm-openai:v0.28.0@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14"
entrypoint = ["vllm", "serve"]
cmd = [
  "meta-models/Muse-Glimmer-30B", "--served-model-name", "muse-glimmer",
  "--host", "0.0.0.0", "--port", "8000", "--download-dir", "/data/huggingface",
  "--dtype", "bfloat16", "--kv-cache-dtype", "auto", "--tensor-parallel-size", "1",
  "--max-model-len", "16384", "--max-num-seqs", "4",
  "--limit-mm-per-prompt", "{\"image\":4}",
  "--enable-auto-tool-choice", "--tool-call-parser", "muse_glimmer",
  "--reasoning-parser", "muse_glimmer", "--generation-config", "auto"
]
